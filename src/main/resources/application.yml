server:
  port: 8080
  # Trust X-Forwarded-* from private-network proxies only, so the client address and https-ness are right behind a reverse proxy.
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        same-site: lax

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:curiokeep}
    username: ${DB_USER:curiokeep}
    password: ${DB_PASS:curiokeep}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_empty

  servlet:
    multipart:
      # Room for an item import file; covers are limited to 5 MB by the image service itself.
      max-file-size: 25MB
      max-request-size: 25MB

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.rostislav.curiokeep: DEBUG   #while developing
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [rid=%X{rid}] %logger{36} - %msg%n"


curiokeep:
  modules:
    schema: "classpath:schema/module-schema-v1.xsd"
    import-dir: ./data/modules-imported
  assets:
    dir: ./data/assets
  setup:
    # When set, creating the first admin requires this token. Use it if the server is reachable before you finish setup.
    token: ${CURIOKEEP_SETUP_TOKEN:}
  providers:
    credentials:
      encryption:
        password: changeme
        salt: 5f4dcc3b5aa765d6
